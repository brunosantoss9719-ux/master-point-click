<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
 <meta name="theme-color" content="#071019">
 <meta name="mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <link rel="manifest" href="manifest.webmanifest">
 <link rel="icon" href="assets/icon-192.png">
 <title>MASTER — Linha de Custódia</title>
 <link rel="stylesheet" href="styles.css?v=casework-3">
</head>
<body>
<main id="app">
 <section id="start" class="screen active">
  <div class="start-bg"></div><div class="grain"></div>
  <div class="start-copy">
   <p class="eyebrow">THRILLER INVESTIGATIVO · FICÇÃO BASEADA EM FATOS PÚBLICOS</p>
   <h1>MASTER</h1><h2>LINHA DE CUSTÓDIA</h2>
   <p>Documentos concordam em alguns campos. Em outros, contam histórias incompatíveis.</p>
   <div class="start-actions"><button id="new" class="primary">Nova investigação</button><button id="continue" hidden>Continuar</button><button id="bonus">Bônus: Copa 2022</button></div>
   <button id="about" class="link">Fontes, fatos e dramatização</button>
  </div>
 </section>
 <section id="game" class="screen">
  <header class="topbar">
   <div><small id="chapter"></small><strong id="scene-title"></strong></div>
   <div class="top-actions"><button id="hint">Dica</button><button id="dossier">Dossiê <b id="evidence-count">0</b></button><button id="audio" aria-label="Som ligado">Som · ligado</button></div>
  </header>
  <section id="stage" class="stage">
   <img id="background" alt=""><div class="shade"></div><div id="date-card" class="date-card"></div>
   <div id="notice" class="notice" aria-live="polite"></div>
  </section>
  <div id="objects" class="objects"></div>
  <section id="dialogue" class="dialogue hidden" tabindex="0" aria-live="polite">
   <div id="portrait" class="portrait"></div>
   <div class="speech"><div><strong id="speaker"></strong><small id="role"></small></div><p id="line"></p><span id="dialogue-prompt">TOQUE PARA CONTINUAR</span></div>
  </section>
  <nav class="actionbar"><button id="scene-view" class="active">Ambiente</button><button id="casework">Mesa do caso</button></nav>
 </section>
 <section id="panel" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="panel-paper"><button id="close-panel" class="close" aria-label="Fechar">×</button><p id="panel-kicker" class="eyebrow"></p><h2 id="panel-title"></h2><div id="panel-body"></div></div>
 </section>
</main>
<script src="content/sources.js?v=casework-3"></script>
<script src="content/master-case.js?v=casework-3"></script>
<script src="app.js?v=casework-3"></script>
</body>
</html>
