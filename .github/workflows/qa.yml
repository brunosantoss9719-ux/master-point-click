name: QA

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate game
        run: |
          npm test
          node --check app.js
      - name: Start static server
        run: |
          npm start >/tmp/master-serve.log 2>&1 &
          echo $! >/tmp/master-serve.pid
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/master-serve.log
          exit 1
      - name: Mobile visual smoke
        run: node scripts/mobile-smoke.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke
          path: artifacts/*.png
          if-no-files-found: warn
